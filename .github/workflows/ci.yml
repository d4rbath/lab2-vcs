name: .NET CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

  defaults:
      run:
        working-directory: ./IPPRPO

    steps:
    - name: Чтение исходного кода
      uses: actions/checkout@v4

    - name: Настройка SDK .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Восстановление зависимостей (NuGet)
      run: dotnet restore

    - name: Сборка проекта
      run: dotnet build --no-restore -c Release

    - name: Запуск модульных тестов (xUnit)
      run: dotnet test --no-build -c Release --verbosity normal