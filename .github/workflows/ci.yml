name: .NET CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Чтение исходного кода
      uses: actions/checkout@v4

    - name: Настройка SDK .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Восстановление зависимостей (NuGet)
      run: dotnet restore IPPRPO_lab1.csproj

    - name: Сборка проекта WPF
      run: dotnet build IPPRPO_lab1.csproj --no-restore -c Release

    - name: Запуск автотестов
      run: dotnet test --no-build -c Release --verbosity normal
      continue-on-error: true